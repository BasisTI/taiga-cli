name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # A release only ships from a commit that passes the same checks as ci.yml
  # (vet, test -race, lint and the integration job).
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
