name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y dbus zsh fish
      - run: go vet ./...
      - run: go test -race ./...
      # The completion scripts run in each shell; a missing one fails instead of skipping.
      - run: go test -v -count=1 -run '^TestCompletionScripts' ./internal/cli
        env:
          TAIGA_TEST_SHELLS: bash,zsh,fish,pwsh
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck dash
      - run: shellcheck -s sh install.sh scripts/test-install
      - run: scripts/test-install dash sh bash
      # Alpine has no curl and a BusyBox wget (no --max-redirect); the whole suite
      # runs there so the wget fallback is exercised for real.
      - run: >
          docker run --rm --network host -v "$PWD:/src:ro" alpine:3.23
          sh -c 'apk add --no-cache python3 >/dev/null && sh /src/scripts/test-install sh'
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker compose -f compose.test.yml up -d
      - run: scripts/taiga-seed
      - run: go test -tags integration -p 1 ./...
      - if: failure()
        run: docker compose -f compose.test.yml logs taiga-back taiga-gateway taiga-protected | tail -300
