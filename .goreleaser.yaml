version: 2
project_name: taiga
builds:
  - main: ./cmd/taiga
    binary: taiga
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/BasisTI/taiga-cli/internal/cli.Version={{.Version}}
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
checksum:
  name_template: SHA256SUMS
release:
  github:
    owner: BasisTI
    name: taiga-cli
